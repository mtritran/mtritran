<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Festive ASCII Cat Preview</title>
  <style>
    body {
      background-color: #0d1117;
      color: #c9d1d9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }
    .container {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
      text-align: center;
      max-width: 650px;
    }
    h2 {
      margin-top: 0;
      color: #58a6ff;
    }
    img {
      max-width: 100%;
      border-radius: 8px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.7);
    }
    .badge {
      display: inline-block;
      margin-top: 15px;
      padding: 6px 14px;
      background: #238636;
      color: white;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>❄️ Festive ASCII Cat Animation 🐾</h2>
    <p>Rendered from Python with dynamic snowfall, warm lamp glow & terminal ASCII aesthetic!</p>
    <img src="./cat_christmas.gif" alt="Festive ASCII Cat" />
    <br>
    <div class="badge">Size: 1.70 MB • 36 Frames Seamless Loop</div>
  </div>
</body>
</html>
